# Local test rig: the same Linux paths as the Debian box, one network segment,
# double NAT (Docker's bridge plays the ISP router at 10.66.0.1).
services:
  gateway:
    build:
      context: .
      dockerfile: dev/Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-arm64}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.all.rp_filter: 0
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./dev/data:/var/lib/useg
      - ./dev/config.yaml:/etc/useg/config.yaml:ro
    networks:
      lan:
        ipv4_address: 10.66.0.2

  client-a:
    build:
      context: .
      dockerfile: dev/Dockerfile.client
    cap_add:
      - NET_ADMIN
    networks:
      lan:
        ipv4_address: 10.66.0.3

  client-b:
    build:
      context: .
      dockerfile: dev/Dockerfile.client
    cap_add:
      - NET_ADMIN
    networks:
      lan:
        ipv4_address: 10.66.0.4

networks:
  lan:
    ipam:
      config:
        - subnet: 10.66.0.0/24
