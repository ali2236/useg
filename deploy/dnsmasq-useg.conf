# /etc/dnsmasq.d/useg.conf
# dnsmasq is the LAN's DHCP and DNS. The lease file is the device inventory's
# raw feed; the agent reads it every 5 seconds.
interface=eth0
# No bind-interfaces/bind-dynamic here: /etc/default/dnsmasq may already pick a
# bind mode, and two of them is a fatal dnsmasq error.

dhcp-range=192.168.100.50,192.168.100.240,12h
dhcp-option=3,192.168.100.2
dhcp-option=6,192.168.100.2

# Friendly portal name, and the upstream resolvers. no-resolv keeps dnsmasq
# from also using the host's /etc/resolv.conf. strict-order turns the list into
# a real fallback chain: the next server is tried only if one fails.
# Plain UDP/53 to public resolvers is often intercepted on a TCI line, so these
# are availability fallbacks, not a way around filtering.
# The ISP router is not in the list: its DNS stops when its DHCP server is off,
# and its DHCP must be off for the box to be the only DHCP server.
address=/portal.gate/192.168.100.2
no-resolv
strict-order
server=1.1.1.1                # Cloudflare
server=217.218.127.127        # TCI
server=217.218.155.155        # TCI
server=10.202.10.202          # Radar (Iran-only)
server=10.202.10.102          # Radar (Iran-only)
server=185.55.226.26          # Begzar
server=185.55.225.25          # Begzar
server=1.0.0.1                # Cloudflare
server=8.8.8.8                # Google
server=8.8.4.4                # Google
server=9.9.9.9                # Quad9
server=149.112.112.112        # Quad9
server=178.22.122.100         # Shecan
server=185.51.200.2           # Shecan

# v1 has no IPv6 path: don't hand clients AAAA records they cannot use.
filter-AAAA

domain-needed
bogus-priv
log-dhcp
# No dhcp-leasefile here: /var/lib/misc/dnsmasq.leases is dnsmasq's built-in
# default, and repeating the keyword in a drop-in is a fatal error.
