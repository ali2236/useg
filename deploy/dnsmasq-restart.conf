# dnsmasq races NetworkManager at boot: wait-online can finish before enp3s0
# exists, and Debian's unit ships Restart=no, so it stays dead until someone
# starts it by hand. Retry instead of depending on boot ordering.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Restart=on-failure
RestartSec=5s
