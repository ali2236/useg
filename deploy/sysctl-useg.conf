# /etc/sysctl.d/90-useg.conf
# Every one of these matters; see DESIGN.md §3.2.
net.ipv4.ip_forward = 1

# ICMP redirects would tell clients to bypass the box and go straight to the
# ISP router, silently defeating metering.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.eth0.send_redirects = 0

# One NIC, traffic in and out the same interface: reverse-path filtering would
# drop legitimate TPROXY traffic.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.eth0.rp_filter = 0

# IPv6 is out of scope for v1.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
